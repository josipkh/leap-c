name: Tests

on:
  push:
  pull_request:

jobs:

  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11","3.12","3.13"]

    steps:

    - name: Checkout leap-c
      uses: actions/checkout@v5
      with:
        path: ${{github.workspace}}/leap_c
        submodules: 'recursive'

    - name: Setup leap-c environment
      uses: ./leap_c/.github/actions/setup-leap-c
      with:
        python-version: ${{ matrix.python-version }}
        extras: test

    - name: Run tests
      working-directory: ${{github.workspace}}/leap_c
      run: |
        pytest tests/leap_c/ -v --ignore=tests/leap_c/test_scripts.py
